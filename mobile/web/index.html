<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Autonomous Financial Copilot for Variable-Income Earners">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Origin Copilot">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <title>Finova — Financial Copilot</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Fonts: Bricolage Grotesque -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap" rel="stylesheet">

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0A1628;
      font-family: 'Bricolage Grotesque', system-ui, -apple-system, sans-serif;
    }
  </style>
</head>
<body>
  <script>
    window.openGoogleOAuth = function(url, usePopup = false) {
      if (usePopup) {
        const width = 500;
        const height = 600;
        const left = window.screenX + (window.outerWidth - width) / 2;
        const top = window.screenY + (window.outerHeight - height) / 2;
        window.open(url, 'google_oauth', `width=${width},height=${height},left=${left},top=${top},status=yes,scrollbars=yes`);
      } else {
        window.location.href = url;
      }
    };

    window.speakCopilotAlert = function(text) {
      try {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.rate = 1.0;
          utterance.pitch = 1.0;
          const voices = window.speechSynthesis.getVoices();
          const enVoice = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Samantha') || v.name.includes('David') || v.name.includes('Zira')));
          if (enVoice) utterance.voice = enVoice;
          window.speechSynthesis.speak(utterance);
        }
      } catch (e) {
        console.error('Speech error:', e);
      }
    };

    window.stopCopilotAlert = function() {
      try {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
      } catch (e) {}
    };

    window.playRingtoneChime = function() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        
        function playBeep(freq, startTime, duration) {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, startTime);
          gain.gain.setValueAtTime(0.2, startTime);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(startTime);
          osc.stop(startTime + duration);
        }

        const now = ctx.currentTime;
        playBeep(523.25, now, 0.15); // C5
        playBeep(659.25, now + 0.18, 0.25); // E5
        playBeep(783.99, now + 0.45, 0.4); // G5
      } catch (e) {
        console.warn('AudioContext chime error:', e);
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
