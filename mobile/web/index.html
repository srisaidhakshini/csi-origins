<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Autonomous Financial Copilot for Variable-Income Earners">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Origin Copilot">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <title>Finova — Financial Copilot</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Fonts: Bricolage Grotesque -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap" rel="stylesheet">

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0A1628;
      font-family: 'Bricolage Grotesque', system-ui, -apple-system, sans-serif;
    }
  </style>
</head>
<body>
  <script>
    window.openGoogleOAuth = function(url, usePopup = false) {
      if (usePopup) {
        const width = 500;
        const height = 600;
        const left = window.screenX + (window.outerWidth - width) / 2;
        const top = window.screenY + (window.outerHeight - height) / 2;
        window.open(url, 'google_oauth', `width=${width},height=${height},left=${left},top=${top},status=yes,scrollbars=yes`);
      } else {
        window.location.href = url;
      }
    };

    window.speakCopilotAlert = function(text) {
      try {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.rate = 1.0;
          utterance.pitch = 1.0;
          const voices = window.speechSynthesis.getVoices();
          const enVoice = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Samantha') || v.name.includes('David') || v.name.includes('Zira')));
          if (enVoice) utterance.voice = enVoice;
          window.speechSynthesis.speak(utterance);
        }
      } catch (e) {
        console.error('Speech error:', e);
      }
    };

    window.stopCopilotAlert = function() {
      try {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
      } catch (e) {}
    };

    // ElevenLabs Base64 Audio Player
    let currentAudio = null;
    window.playBase64Audio = function(base64Audio) {
      try {
        if (currentAudio) {
          currentAudio.pause();
          currentAudio = null;
        }
        const audioSrc = "data:audio/mp3;base64," + base64Audio;
        currentAudio = new Audio(audioSrc);
        currentAudio.play();
      } catch (e) {
        console.error('ElevenLabs audio playback error:', e);
      }
    };

    window.stopBase64Audio = function() {
      try {
        if (currentAudio) {
          currentAudio.pause();
          currentAudio = null;
        }
      } catch (e) {}
    };

    // Speech-to-Text Recognition for Voice to Text & Speech to Speech
    let recognition = null;
    window.startSpeechRecognition = function(callbackName) {
      try {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          console.warn('Web Speech API not supported on this browser');
          if (window[callbackName]) window[callbackName]('ERROR: Speech recognition not supported in browser');
          return;
        }
        if (recognition) {
          recognition.abort();
        }
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = 'en-US';

        recognition.onresult = function(event) {
          if (event.results && event.results.length > 0) {
            const transcript = event.results[0][0].transcript;
            console.log('🎤 Speech recognized:', transcript);
            if (window[callbackName]) {
              window[callbackName](transcript);
            }
          }
        };

        recognition.onerror = function(event) {
          console.warn('🎤 Speech error:', event.error);
          if (window[callbackName]) {
            window[callbackName]('ERROR: ' + event.error);
          }
        };

        recognition.onend = function() {
          console.log('🎤 Speech recognition ended');
        };

        recognition.start();
        console.log('🎤 Speech recognition started...');
      } catch (e) {
        console.error('Speech recognition exception:', e);
      }
    };

    window.stopSpeechRecognition = function() {
      try {
        if (recognition) {
          recognition.stop();
          recognition = null;
        }
      } catch (e) {}
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
